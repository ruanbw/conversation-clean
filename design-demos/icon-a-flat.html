<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向 A — Flat Minimal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: #1e1e1e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 48px 24px;
  }
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 600;
    color: #f0f0f0;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 14px;
    color: #888;
  }
  .badge {
    display: inline-block;
    background: #D98C00;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
  }
  .showcase {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 40px;
    max-width: 900px;
    margin: 0 auto;
  }
  .icon-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .icon-label {
    font-size: 12px;
    color: #666;
    font-variant-numeric: tabular-nums;
  }
  .dock-bg {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(10px);
  }
  .finder-bg {
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 12px;
  }
</style>
</head>

<div class="header">
  <div class="badge">DIRECTION A</div>
  <h1>Flat Minimal</h1>
