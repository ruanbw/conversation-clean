<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向 C — Modern Badge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: #1e1e1e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 48px 32px;
  }
  .header {
    max-width: 900px;
    margin: 0 auto 48px;
    text-align: center;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #f5f5f5;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 15px;
    color: #999;
    margin-bottom: 16px;
  }
  .badge-tag {
    display: inline-block;
    background: #D98C00;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 14px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .section-title {
    max-width: 900px;
    margin: 40px auto 20px;
    font-size: 14px;
    font-weight: 600;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .showcase {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: center;
  }
  .icon-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .icon-card .label {
    font-size: 12px;
    color: #777;
    font-variant-numeric: tabular-nums;
  }
  .icon-card .label span {
      color: #bbb;
      font-weight: 500;
  }
  .dock-bg {
    background: linear-gradient(180deg, #3a3a3c 0%, #2c2c2e 100%);
    border-radius: 24px;
    padding: 40px;
    display: flex;
    gap: 28px;
    justify-content: center;
    align-items: flex-end;
    max-width: 900px;
    margin: 0 auto;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .finder-bg {
    background: #2d2d2d;
    border-radius: 12px;
    padding: 32px;
    display: flex;
    gap: 32px;
    align-items: center;
    max-width: 900px;
    margin: 0 auto;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    border: 1px solid #444;
  }
  .finder-sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .finder-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #ccc;
  }
  .finder-item.active {
    background: #D98C00;
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
  }
  .grid-bg {
    background: #252525;
    border-radius: 16px;
    padding: 36px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    justify-items: center;
    max-width: 900px;
    margin: 0 auto;
  }
  svg { display: block; }
</style>
</head>
<body>

<div class="header">

  <p>ConversationClean macOS 应用图标 — 现代徽章风格</p>
  <span class="badge-tag">BADGE STYLE</span>
</div>
